# URL: /home/laboratorio/TFM/agarre_ros2_ws/scripts/bridge_cameras.yaml
# Summary: Base ros_gz_bridge mapping for RGB and depth camera topics.
# bridge_cameras.yaml  (BASE)
# OJO: Este YAML es el único que usa el bridge.
# Incluye /clock y /world/<world>/pose/info para el mundo principal.

- ros_topic_name: /clock
  gz_topic_name: /world/ur5_mesa_objetos/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /world/ur5_mesa_objetos/pose/info
  gz_topic_name: /world/ur5_mesa_objetos/pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /camera_overhead/image
  gz_topic_name: /camera_overhead/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera_north/image
  gz_topic_name: /camera_north/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera_south/image
  gz_topic_name: /camera_south/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera_east/image
  gz_topic_name: /camera_east/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera_west/image
  gz_topic_name: /camera_west/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS


# depth_image
- ros_topic_name: /camera_overhead/depth_image
  gz_topic_name: /camera_overhead/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera_north/depth_image
  gz_topic_name: /camera_north/depth_image
